version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: cheguei_mae_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cheguei_mae
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cheguei_mae"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
